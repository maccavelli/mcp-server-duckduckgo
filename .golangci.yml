version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - errcheck
          - gocognit
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - ineffassign
          - nilerr
          - revive
          - staticcheck
          - unparam
          - unused
        path: (ui\.go|analyzer\.go|client\.go|tui\.go|login\.go|main\.go|search\.go|git\.go|config\.go|index\.go|internal\.go|logs\.go|kibana\.go)
      - linters:
          - godot
        text: Comment should end in a period
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
